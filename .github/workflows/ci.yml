name: IntegracaoCI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      # BACKEND: Testes da API
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Instalar dependências do backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: 🚀 Iniciar FastAPI
        working-directory: backend
        run: |
          nohup uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 5 


      - name: Rodar testes do backend
        working-directory: backend/tests
        run: |
          echo "Iniciando testes de API..."
          python test_api.py

          echo "Rodando test_proposicoes.py..."
          python test_proposicoes.py

          echo "✅ Testes do backend finalizados com sucesso."


      # FRONTEND: Build e Lint
      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm install

      - name: Build do projeto Vite
        working-directory: frontend
        run: npm run build

      - name: Rodar ESLint (se configurado)
        working-directory: frontend
        run: npm run lint
